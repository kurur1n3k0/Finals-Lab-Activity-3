server {
    listen       80;
    server_name  finalprj.yourdomain.com;

    location / {
        root   /var/www/finalprj/dist;
        index  index.html index.htm;
        # Crucial for Vue Router history mode:
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}